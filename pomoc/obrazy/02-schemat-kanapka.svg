<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="260" fill="#f8fafc" rx="8"/>
  <text x="24" y="30" font-size="15" font-weight="bold" fill="#1e293b">Jak działa kanapka warstw w MapoTero</text>

  <!-- Left: UI list representation -->
  <rect x="24" y="48" width="250" height="186" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="70" font-size="12" font-weight="bold" fill="#475569">Panel „Wybrane warstwy”</text>

  <rect x="38" y="84" width="222" height="36" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="48" y="106" font-size="12" font-weight="bold" fill="#1d4ed8">1) Ortofotomapa 25 cm (100%)</text>

  <rect x="38" y="128" width="222" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="150" font-size="12" font-weight="bold" fill="#b45309">2) Cieniowanie rzeźby NMT (45%)</text>

  <rect x="38" y="172" width="222" height="36" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="48" y="194" font-size="12" font-weight="bold" fill="#047857">3) Szlaki piesze – nakładka (100%)</text>

  <!-- Arrow -->
  <path d="M 290 140 L 336 140" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <polygon points="334,134 346,140 334,146" fill="#64748b"/>

  <!-- Right: 3D stack (1 on bottom, 3 on top) -->
  <!-- Layer 1 bottom -->
  <polygon points="365,204 545,204 585,176 405,176" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="595" y="194" font-size="12" font-weight="bold" fill="#1d4ed8">1) Podkład (spód)</text>

  <!-- Layer 2 middle -->
  <polygon points="365,152 545,152 585,124 405,124" fill="#fde68a" fill-opacity="0.72" stroke="#d97706" stroke-width="1.8"/>
  <text x="595" y="142" font-size="12" font-weight="bold" fill="#b45309">2) Krycie 45%</text>

  <!-- Layer 3 top -->
  <polygon points="365,100 545,100 585,72 405,72" fill="#a7f3d0" fill-opacity="0.45" stroke="#059669" stroke-width="1.8"/>
  <path d="M 412 88 Q 475 78 548 92" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="595" y="90" font-size="12" font-weight="bold" fill="#047857">3) Wierzch (nakładka)</text>

  <text x="365" y="238" font-size="11.5" fill="#475569">Warstwa nr 1 leży na spodzie. Kolejne numery nakładają się od góry.</text>
</svg>
