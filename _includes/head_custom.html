/* === RESPONSYWNOŚĆ MOBILE (< 50rem / 800px) === */

  body, .main-content {
    font-size: 15.5px !important;
    line-height: 1.62 !important;
  }

  .site-header {
    min-height: 3.5rem !important;
    padding-right: 0.5rem !important;
  }

  .site-title {
    font-size: 1.12rem !important;
    white-space: nowrap !important;
  }

  #menu-button {
    min-width: 44px !important;
    min-height: 44px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .search-input-wrap {
    height: 2.85rem !important;
  }

  /* Zapobieganie automatycznemu powiększaniu strony na iOS Safari */
  .search-input {
    font-size: 16px !important;
  }

  .search-result {
    padding: 0.65rem 0.75rem !important;
  }

  .aux-nav-list-item a.site-button {
    min-height: 40px !important;
    padding: 0.4rem 0.75rem !important;
  }

  .main-content h1 {
    font-size: 1.65rem !important;
    line-height: 1.25 !important;
    margin-top: 0.25rem !important;
    margin-bottom: 0.65rem !important;
  }

  .main-content h2 {
    font-size: 1.28rem !important;
    margin-top: 1.75rem !important;
    margin-bottom: 0.7rem !important;
  }

  .main-content h3 {
    font-size: 1.08rem !important;
    margin-top: 1.35rem !important;
  }

  .main-content p.fs-6,
  .main-content p.fs-5 {
    font-size: 1rem !important;
    margin-bottom: 1.1rem !important;
  }

  .main-content a.btn,
  a.btn,
  .btn {
    min-height: 44px !important;
    padding: 0.55rem 1rem !important;
  }

  p.informacja, blockquote.informacja, p.informacja-title, blockquote.informacja-title,
  p.wskazowka, blockquote.wskazowka, p.wskazowka-title, blockquote.wskazowka-title,
  p.uwaga, blockquote.uwaga, p.uwaga-title, blockquote.uwaga-title,
  p.nowosc, blockquote.nowosc, p.nowosc-title, blockquote.nowosc-title,
  p.w_przygotowaniu, blockquote.w_przygotowaniu, p.w_przygotowaniu-title, blockquote.w_przygotowaniu-title,
  .callout {
    padding: 0.8rem 0.95rem !important;
    margin: 1rem 0 !important;
    font-size: 0.9rem !important;
  }

  .table-wrapper {
    margin: 1.15rem 0 !important;
  }

  .main-content table th {
    padding: 0.55rem 0.65rem !important;
    font-size: 0.72rem !important;
  }

  .main-content table td {
    padding: 0.55rem 0.65rem !important;
    font-size: 0.84rem !important;
    line-height: 1.45 !important;
  }

  .main-content table code {
    overflow-wrap: anywhere !important;
    word-break: break-word !important;
  }

  pre {
    padding: 0.8rem 0.95rem !important;
    font-size: 0.84rem !important;
  }

  .mt-scroll-top-mobile.widoczny {
    display: inline-flex;
  }

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var main = document.querySelector(".main-content");
  if (!main) return;

  // 1. Zapewnienie przewijania poziomego tabel także bez wrappera motywu
  main.querySelectorAll("table").forEach(function (tbl) {
    if (tbl.closest("#galeria-warstw-app") || tbl.closest(".table-wrapper")) return;
    var wrap = document.createElement("div");
    wrap.className = "table-wrapper";
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });

  // 2. Zwijanie długiego spisu treści na mobile, aby nie zasłaniał treści na starcie
  if (window.matchMedia && window.matchMedia("(max-width: 799px)").matches) {
    main.querySelectorAll("details[open]").forEach(function (det) {
      var toc = det.querySelector("#markdown-toc, .markdown-toc, ul");
      if (toc && toc.querySelectorAll("li").length > 8) {
        det.removeAttribute("open");
      }
    });
  }

  // 3. Lightbox powiększenia dla zrzutów ekranu i schematów dokumentacji
  var obrazy = Array.prototype.filter.call(main.querySelectorAll("img"), function (img) {
    if (img.closest("#galeria-warstw-app") || img.closest("a") || img.classList.contains("no-lightbox")) {
      return false;
    }
    return true;
  });

  if (obrazy.length > 0) {
    var lbTlo = document.createElement("div");
    lbTlo.className = "mt-lightbox-tlo";
    lbTlo.hidden = true;
    lbTlo.setAttribute("role", "dialog");
    lbTlo.setAttribute("aria-modal", "true");
    lbTlo.setAttribute("aria-label", "Powiększenie ilustracji");

    var lbPasek = document.createElement("div");
    lbPasek.className = "mt-lightbox-pasek";
    var lbPodpis = document.createElement("span");
    lbPodpis.className = "mt-lightbox-podpis";
    var lbZamknij = document.createElement("button");
    lbZamknij.type = "button";
    lbZamknij.className = "mt-lightbox-zamknij";
    lbZamknij.textContent = "Zamknij ×";
    lbPasek.appendChild(lbPodpis);
    lbPasek.appendChild(lbZamknij);

    var lbObszar = document.createElement("div");
    lbObszar.className = "mt-lightbox-obszar";
    var lbImg = document.createElement("img");
    lbObszar.appendChild(lbImg);

    var lbPodp = document.createElement("div");
    lbPodp.className = "mt-lightbox-podpowiedz";
    lbPodp.textContent = "Rozsuń dwoma palcami, aby przybliżyć szczegóły";

    lbTlo.appendChild(lbPasek);
    lbTlo.appendChild(lbObszar);
    lbTlo.appendChild(lbPodp);
    document.body.appendChild(lbTlo);

    var ostatniFocus = null;
    function zamknijLb() {
      if (lbTlo.hidden) return;
      lbTlo.hidden = true;
      document.documentElement.style.overflow = "";
      if (ostatniFocus && typeof ostatniFocus.focus === "function") {
        try { ostatniFocus.focus({ preventScroll: true }); } catch (e) {}
      }
      ostatniFocus = null;
    }

    function otworzLb(img) {
      ostatniFocus = document.activeElement;
      lbImg.src = img.currentSrc || img.src;
      lbImg.alt = img.alt || "";
      lbPodpis.textContent = img.alt || "Podgląd ilustracji";
      lbTlo.hidden = false;
      document.documentElement.style.overflow = "hidden";
      lbZamknij.focus({ preventScroll: true });
    }

    lbZamknij.addEventListener("click", zamknijLb);
    lbTlo.addEventListener("click", function (e) {
      if (e.target === lbTlo || e.target === lbObszar) zamknijLb();
    });
    document.addEventListener("keydown", function (e) {
      if (!lbTlo.hidden && e.key === "Escape") zamknijLb();
    });

    obrazy.forEach(function (img) {
      img.classList.add("mt-lightbox-gotowy");
      img.title = img.title || "Kliknij, aby powiększyć";
      img.addEventListener("click", function () {
        otworzLb(img);
      });
    });
  }

  // 4. Pływający przycisk "Na górę" na długich stronach mobilnych (poza Galerią z dokiem)
  if (!document.getElementById("galeria-warstw-app")) {
    var btnTop = document.createElement("button");
    btnTop.type = "button";
    btnTop.className = "mt-scroll-top-mobile";
    btnTop.setAttribute("aria-label", "Przewiń na górę strony");
    btnTop.textContent = "↑";
    btnTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.body.appendChild(btnTop);

    var tickScroll = false;
    window.addEventListener("scroll", function () {
      if (tickScroll) return;
      tickScroll = true;
      requestAnimationFrame(function () {
        tickScroll = false;
        btnTop.classList.toggle("widoczny", window.scrollY > 420);
      });
    }, { passive: true });
  }
});
</script>
